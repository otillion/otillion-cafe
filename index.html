<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Otillion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: sidebar + workspace on desktop, bottom tab bar on phones; one codebase, AR/TR, RTL/LTR */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F0F0F0; --ink:#000000; --muted:#555555; --line:#D4D4D4;
  --accent:#000000; --accent-ink:#FFFFFF; --accent-soft:#EDEDED;
  --warn:#3D3D3D; --warn-soft:#EDEDED; --bad:#000000; --bad-soft:#E2E2E2; --good:#2B2B2B; --good-soft:#F0F0F0;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif; --body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
}
@media (prefers-color-scheme:light){:root:not([data-theme="light"]){
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F0F0F0; --ink:#000000; --muted:#555555; --line:#D4D4D4;
  --accent:#000000; --accent-ink:#FFFFFF; --accent-soft:#EDEDED;
  --warn:#3D3D3D; --warn-soft:#EDEDED; --bad:#000000; --bad-soft:#E2E2E2; --good:#2B2B2B; --good-soft:#F0F0F0; color-scheme:light}}
:root[data-theme="dark"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F0F0F0; --ink:#000000; --muted:#555555; --line:#D4D4D4;
  --accent:#000000; --accent-ink:#FFFFFF; --accent-soft:#EDEDED;
  --warn:#3D3D3D; --warn-soft:#EDEDED; --bad:#000000; --bad-soft:#E2E2E2; --good:#2B2B2B; --good-soft:#F0F0F0; color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:26px}h2{font-size:20px}h3{font-size:15px}
.muted{color:var(--muted)}.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .flip{transform:scaleX(-1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500;cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);max-width:100%;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--muted);padding:7px 12px;font-size:13px;font-weight:500;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}.pill.low{background:var(--warn-soft);color:var(--warn)}.pill.out{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
/* login */
.login{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;max-width:1080px;margin:0 auto;padding-block:40px;min-height:100%}
.hero .lang-row{margin-bottom:56px}
.wordmark{font-size:clamp(56px,11vw,112px);line-height:.95;letter-spacing:-.03em;font-weight:600}
.wordmark span{display:block;font-size:.5em;color:var(--accent);letter-spacing:0;margin-top:6px}
.lead{font-size:18px;color:var(--muted);max-width:30em;margin:22px 0 26px}
.feats{list-style:none;margin:0;padding:0;display:grid;gap:0;max-width:26em}
.feats li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.feats .ic{color:var(--accent)}
.signcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:16px}
.gbtn{padding:13px 16px;font-size:16px}
.gbtn .g{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:13px}
.note{font-size:13px;color:var(--muted);margin:0}
/* workspaces */
.wsp{max-width:780px;margin:0 auto;padding-block:36px;display:grid;gap:22px}
.wsp .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.wlist{display:grid;gap:0;border-top:1px solid var(--line)}
.witem{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;padding:16px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:start;cursor:pointer;width:100%}
.witem:hover{background:var(--surface2)}
.witem b{font-family:var(--display);font-size:18px;font-weight:500}
.wnew{display:flex;gap:10px;flex-wrap:wrap}
.wnew input{flex:1;min-width:180px}
input,select{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
/* shell */
.shell{display:grid;grid-template-columns:228px minmax(0,1fr);column-gap:32px;padding-block:20px;max-width:1400px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:22px;color:var(--accent)}
.brand svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wsbtn{display:grid;gap:2px;text-align:start;padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;width:100%}
.wsbtn small{color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;color:var(--muted);border-radius:8px;font-weight:500;cursor:pointer;text-align:start;position:relative}
.nav button:hover{background:var(--surface2)}
.nav button[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.bubble{margin-inline-start:auto;min-width:20px;height:20px;border-radius:10px;background:var(--warn);color:var(--bg);font-size:12px;display:grid;place-items:center;padding:0 6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top .tr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:relative}
.mws{display:none}
.avatar{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);font-weight:600;cursor:pointer}
.menu{position:absolute;inset-inline-end:0;top:44px;z-index:30;width:min(300px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.menu select{width:100%}
.menu .who{display:grid;gap:2px}
.tabbar{display:none}
@media (max-width:900px){
  .login{grid-template-columns:1fr;gap:28px;padding-block:24px}.hero .lang-row{margin-bottom:28px}
  .shell{grid-template-columns:minmax(0,1fr);padding-bottom:84px}
  .side{display:none}
  .mws{display:grid}
  .top h1{flex-basis:100%;order:3}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar button{display:grid;justify-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:11px;padding:4px 6px;cursor:pointer;min-width:0;position:relative;flex:1}
  .tabbar button[aria-current=page]{color:var(--accent)}
  .tabbar .bubble{position:absolute;top:0;inset-inline-end:14%;margin:0;min-width:16px;height:16px;font-size:10px}
}
/* pos */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:12px}
.tbl{display:grid;gap:2px;justify-items:start;text-align:start;padding:12px 14px;min-height:104px;border-radius:12px;border:1px dashed var(--line);background:transparent;cursor:pointer;position:relative;align-content:start}
.tbl .tn{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.1}
.tbl .tk{font-size:12px;color:var(--muted)}
.tbl .tm{font-weight:500;font-variant-numeric:tabular-nums}
.tbl .tt{font-size:12px;color:var(--muted)}
.tbl.open{border:1px solid var(--accent);background:var(--accent-soft)}
.tbl.ready{border:1px solid var(--warn);background:var(--warn-soft)}
.tbl .badge{position:absolute;top:10px;inset-inline-end:10px;font-size:11px;font-weight:600;color:var(--warn)}
.tbl:hover{border-style:solid}
.order{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.panes{display:none;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{display:grid;gap:3px;justify-items:start;text-align:start;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;position:relative}
.item:hover:not(:disabled){border-color:var(--accent)}
.item .in{font-weight:500}.item .ip{color:var(--muted);font-variant-numeric:tabular-nums}.item .is{font-size:11px;color:var(--muted)}
.item:disabled{opacity:.5;cursor:not-allowed}
.item .sold{position:absolute;top:8px;inset-inline-end:8px;font-size:11px;color:var(--bad);font-weight:600}
.ticket{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.th{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lines{list-style:none;margin:0;padding:0;display:grid}
.lines li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.qty span{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.sum{display:grid;gap:4px;margin:0}
.sum div{display:flex;justify-content:space-between}
.sum .big{font-family:var(--display);font-size:22px;font-weight:600}
.tact{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:980px){
  .order{grid-template-columns:minmax(0,1fr)}
  .panes{display:block}
  .order[data-pane=menu] .ticket{display:none}
  .order[data-pane=ticket] .menu-pane{display:none}
  .ticket{position:static}
}
/* modal + toast */
.rcpt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;display:grid;gap:6px;color:var(--ink)}
.rcpt .c{text-align:center}.rcpt .r{display:flex;justify-content:space-between;gap:10px}.rcpt hr{border:0;border-top:1px dashed var(--line);margin:4px 0;width:100%}
@media print{#app>*:not(.overlay){display:none!important}.overlay{position:static!important;background:none!important;padding:0!important}.modal{border:0!important;box-shadow:none!important;width:80mm!important;max-height:none!important;overflow:visible!important;padding:0!important}.noprint{display:none!important}body{background:#fff!important}.rcpt{color:#000;font-size:12px}}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:min(520px,100%);max-height:90%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.pgrid .btn{padding:14px 8px}
.stepper{display:inline-flex;align-items:center;gap:10px}
.field{display:grid;gap:6px}
.field label,.lbl{font-size:13px;color:var(--muted)}
.chk{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;max-width:92vw;text-align:center}
@media (max-width:900px){.toast{bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}}
/* kitchen */
.kcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.kcol h3{display:flex;justify-content:space-between;margin-bottom:10px;color:var(--muted)}
.kcard{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;display:grid;gap:10px;margin-bottom:12px}
.kcard .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--display);font-weight:600}
.kcard ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.q2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.qbox{border:1px solid var(--line);border-radius:12px;padding:18px;min-height:180px;background:var(--surface)}
.qnums{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.qn{font-family:var(--display);font-size:30px;font-weight:600;padding:6px 16px;border-radius:10px;background:var(--surface2)}
.qbox.r .qn{background:var(--good-soft);color:var(--good)}
@media (max-width:900px){.kcols,.q2{grid-template-columns:1fr}}
/* tables & panels */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--muted);text-align:start;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.rgrid .wide{grid-column:1/-1}
@media (max-width:900px){.rgrid{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;border-block:1px solid var(--line);padding-block:14px;margin-bottom:18px}
.kpis .v{font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpis .l{font-size:13px;color:var(--muted)}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.yax{display:flex;flex-direction:column;justify-content:space-between;height:180px;font-size:11px;color:var(--muted);text-align:end;font-variant-numeric:tabular-nums}
.plot{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;align-items:end;height:180px;
  background:linear-gradient(to bottom,var(--line) 1px,transparent 1px) top/100% 90px repeat-y;border-bottom:1px solid var(--line)}
.bar-c{background:var(--accent);opacity:.5;border-radius:3px 3px 0 0;min-height:2px;width:100%}
.bar-c.peak{opacity:1}
.xax{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
@media (max-width:560px){.xax .odd{visibility:hidden}}
.hb{display:grid;grid-template-columns:minmax(80px,1fr) 2fr auto;gap:10px;align-items:center;font-size:14px}
.trk{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}.trk i{display:block;height:100%;background:var(--accent)}
.lvl{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;vertical-align:middle}.lvl i{display:block;height:100%;background:var(--good)}
.lvl.low i{background:var(--warn)}.lvl.out i{background:var(--bad)}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);margin-bottom:14px;font-weight:500}
.good{color:var(--good)}.bad{color:var(--bad)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.shbtn{border:0;cursor:pointer}
.alist{list-style:none;margin:0;padding:0;display:grid}
.alist li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.inl{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.sec{display:grid;gap:18px}
.gt{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}
.adm{max-width:1040px;margin:0 auto;padding-block:32px;display:grid;gap:20px}
.adm .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:4px}.kpi b{font-family:var(--display);font-size:24px;font-weight:600}
.cafehd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
@media(max-width:720px){.rgrid{grid-template-columns:minmax(0,1fr)}}
</style>
